.back-to-portfolio{display:inline-flex;align-items:center;padding:10px 18px;border:1px solid #77a6c3;border-radius:22px;background:linear-gradient(#f1fcff,#b6dceb 49%,#91c4df 50%,#cfedf7);box-shadow:inset 0 1px 2px white,0 3px 10px #315d7b22;text-decoration:none;font-weight:600;font-size:14px}.back-to-portfolio:hover{background:linear-gradient(#fff,#9ddaf4);box-shadow:0 0 12px #d1f8ff}.back-to-portfolio:active{transform:translateY(1px)}nav{align-items:center}</style></head><body><main><div class="titlebar">Evelyn Mao’s Cyberspace — Just Keep Breathing</div><div class="content"><nav><a class="back-to-portfolio" href="./" aria-label="Back to portfolio">‹ Back to Portfolio</a></nav><h1>Just Keep Breathing <small>(Currently in development)</small></h1><section class="screenshots" aria-labelledby="screenshots-title"><h2 id="screenshots-title">Screenshots</h2><div class="screenshot-grid"><button class="screenshot-open" data-image="breathing-screenshots/1.png" aria-label="Enlarge screenshot 1"><img src="breathing-screenshots/1.png" alt="Just Keep Breathing — screenshot 1" loading="lazy" decoding="async"></button><button class="screenshot-open" data-image="breathing-screenshots/2.png" aria-label="Enlarge screenshot 2"><img src="breathing-screenshots/2.png" alt="Just Keep Breathing — screenshot 2" loading="lazy" decoding="async"></button><button class="screenshot-open" data-image="breathing-screenshots/3.png" aria-label="Enlarge screenshot 3"><img src="breathing-screenshots/3.png" alt="Just Keep Breathing — screenshot 3" loading="lazy" decoding="async"></button><button class="screenshot-open" data-image="breathing-screenshots/4.png" aria-label="Enlarge screenshot 4"><img src="breathing-screenshots/4.png" alt="Just Keep Breathing — screenshot 4" loading="lazy" decoding="async"></button><button class="screenshot-open" data-image="breathing-screenshots/5.png" aria-label="Enlarge screenshot 5"><img src="breathing-screenshots/5.png" alt="Just Keep Breathing — screenshot 5" loading="lazy" decoding="async"></button><button class="screenshot-open" data-image="breathing-screenshots/6.png" aria-label="Enlarge screenshot 6"><img src="breathing-screenshots/6.png" alt="Just Keep Breathing — screenshot 6" loading="lazy" decoding="async"></button><button class="screenshot-open" data-image="breathing-screenshots/7.png" aria-label="Enlarge screenshot 7"><img src="breathing-screenshots/7.png" alt="Just Keep Breathing — screenshot 7" loading="lazy" decoding="async"></button><button class="screenshot-open" data-image="breathing-screenshots/8.png" aria-label="Enlarge screenshot 8"><img src="breathing-screenshots/8.png" alt="Just Keep Breathing — screenshot 8" loading="lazy" decoding="async"></button><button class="screenshot-open" data-image="breathing-screenshots/respiration-belt.jpg" aria-label="Enlarge respiration belt photo"><img src="breathing-screenshots/respiration-belt.jpg" alt="Vernier Go Direct respiration belt worn around the torso to control the game through breathing" loading="lazy" decoding="async"></button></div></section></div></main><dialog id="image-viewer" aria-label="Screenshot viewer"><button id="close-image" aria-label="Close screenshot">Close ×</button><img id="full-image" alt="Just Keep Breathing enlarged screenshot"></dialog><script>const viewer=document.getElementById('image-viewer');document.querySelectorAll('.screenshot-open').forEach(button=>button.onclick=()=>{document.getElementById('full-image').src=button.dataset.image;viewer.showModal()});document.getElementById('close-image').onclick=()=>viewer.close();viewer.addEventListener('click',event=>{if(event.target===viewer)viewer.close()});</script></body></html>
