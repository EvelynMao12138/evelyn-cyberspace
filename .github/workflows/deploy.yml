name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let artifact;
            for (let i = 0; i < 12; i++) {
              const result = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: context.runId });
              artifact = result.data.artifacts.find(a => a.name === 'github-pages');
              if (artifact) break;
              await new Promise(r => setTimeout(r, 5000));
            }
            if (!artifact) throw new Error('Pages artifact unavailable');
            const oidc_token = await core.getIDToken();
            const result = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo, artifact_id: artifact.id, pages_build_version: context.sha, oidc_token
            });
            core.setOutput('page_url', result.data.page_url);
            for (let i = 0; i < 120; i++) {
              const status = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                owner, repo, deployment_id: result.data.id
              });
              core.info('Pages status: ' + status.data.status);
              if (status.data.status === 'succeed') return;
              if (['errored', 'deployment_failed', 'deployment_content_failed', 'cancelled'].includes(status.data.status)) throw new Error(status.data.status);
              await new Promise(r => setTimeout(r, 5000));
            }
            throw new Error('Pages deployment timed out');
